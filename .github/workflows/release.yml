# Publish a GitHub Release with ios3ds-<version>.zip (built by build.yml).
#   - push a tag v*                     -> release named after the tag
#   - Actions -> release -> Run workflow -> release + tag <version> at the chosen commit
# The zip holds only our own builds + the installer scripts (docs/release.md).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version / tag to create, e.g. v0.1.0
        type: string
        required: true
      prerelease:
        description: mark as pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          zip="dist/ios3ds-$VERSION.zip"
          test -f "$zip"
          sha256sum "$zip" | tee "$zip.sha256"
          cat > notes.md <<EOF
          Stock iOS 4.2.1 on the Old Nintendo 3DS. **How to install: [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/INSTALL.md)**

          \`ios3ds-$VERSION.zip\` contains only this project's own builds (3DS payload, Homebrew Launcher app, kernel shim, our iOS programs) and the installer. You supply the iPod touch 2G firmware \`iPod2,1_4.2.1_8C148_Restore.ipsw\`; the installer turns it into the SD card files on your own PC:

              python3 install.py iPod2,1_4.2.1_8C148_Restore.ipsw /path/to/your/sdcard

          SHA-256: \`$(cut -d' ' -f1 "$zip.sha256")\`
          EOF
          flags=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            flags+=(--verify-tag)
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          else
            flags+=(--target "$GITHUB_SHA")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          fi
          gh release create "$VERSION" "$zip" "$zip.sha256" --title "ios3ds $VERSION" \
            --notes-file notes.md "${flags[@]}"
